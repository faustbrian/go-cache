schema_version: 1
tool_version: v2.1.0
tool_checksums_sha256: 5517b5ec9872ad51546409de37b2932a90f230c673570998f8696416b149e5c6
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/v3-baseline.txt
operations:
- module: .
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^Test(GetOrLoadCoalescesConcurrentCallersPerLogicalKey|GetOrLoadLeaderCancellationDoesNotCancelFollower|CloseCancelsLoaderWaitingForGlobalSlot|ShutdownUsesCallerDeadline|ShutdownDuringPublicationWaitPreventsLateWrite)$'
    race: true
    count: 1
    timeout: 2m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzKeySpace$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzJSONCodec$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPayloadVersions$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzOptionCombinations$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./internal/wire"]
    fuzz: '^FuzzDecode$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./backend/memory"]
    fuzz: '^FuzzBackendConformanceOperations$'
    budget: 10000x
    timeout: 2m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
